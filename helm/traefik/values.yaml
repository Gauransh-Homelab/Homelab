# Traefik Helm Chart Values - NPM Replacement
# Provides: Auto SSL via Let's Encrypt, Web Dashboard, Multiple DNS Providers

# High Availability Deployment
deployment:
  kind: Deployment
  replicas: 2 # HA setup - one pod can fail without service interruption

# Entry Points - Where Traefik listens for traffic
ports:
  web:
    port: 8000 # Internal container port
    expose:
      default: true
    exposedPort: 80 # External HTTP port
  websecure:
    port: 8443 # Internal container port
    expose:
      default: true
    exposedPort: 443 # External HTTPS port

# MetalLB LoadBalancer Service - Gets external IP like arr-stack services
service:
  type: LoadBalancer
  externalTrafficPolicy: Local # Preserves real client IP addresses (important for logs/security)
  loadBalancerIP: "192.168.10.22" # Request specific IP from MetalLB pool

# Certificate management now handled by cert-manager
# Use ClusterIssuers: letsencrypt-cloudflare or letsencrypt-duckdns
# Add cert-manager annotations to IngressRoute resources for automatic certificates

# No persistent storage needed - cert-manager handles certificates as Kubernetes secrets
# persistence:
#   enabled: false

# Dashboard Configuration - managed via separate IngressRoute
ingressRoute:
  dashboard:
    enabled: false # We manage the dashboard IngressRoute separately

# DNS credentials now used by cert-manager ClusterIssuers
# No environment variables needed in Traefik
# env: []

# Logging Configuration
# Chart v41.0.0 aligned these keys with upstream Traefik syntax:
#   logs.general -> log      |  logs.access -> accessLog
# NOTE: additionalArguments below still passes --log.level=INFO, which is
# rendered last and therefore wins over the level set here.
log:
  level: DEBUG # Change to DEBUG for troubleshooting
accessLog:
  enabled: true # Access logs for monitoring

# Prometheus Metrics - Optional monitoring integration
metrics:
  prometheus:
    enabled: true
    # If you have Prometheus Operator, this will auto-discover

# Resource Limits - Appropriate for homelab environment
# NOTE: the chart derives GOMAXPROCS from limits.cpu (rounded up to a whole
# core). The previous 100m limit gave Traefik a single Go thread with only
# 0.1 core of quota, so a burst of slow backend requests starved the /ping
# handler and tripped the probes below.
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "1000m"
    memory: "256Mi"

# Health probes - the chart defaults to readiness failureThreshold: 1, which
# marks the pod NotReady (and emits a Warning event) on a single missed /ping.
# Use the Kubernetes-standard 3 so a transient blip doesn't flap the pod.
readinessProbe:
  failureThreshold: 3
  initialDelaySeconds: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

livenessProbe:
  failureThreshold: 3
  initialDelaySeconds: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# Spread the 2 replicas across nodes so one saturated node cannot take out
# both. Dormant today: the control plane is the only other node and it carries
# a NoSchedule taint, so both replicas stay on the worker. Kept as "preferred"
# (never blocks scheduling) so it starts spreading automatically once a third
# node joins. Deliberately NOT paired with a control-plane toleration: MetalLB
# refuses to advertise from nodes labelled
# node.kubernetes.io/exclude-from-external-load-balancers, so a replica there
# would take no external traffic and could not take over on failover.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik


# Additional Arguments - Basic configuration for cert-manager integration
additionalArguments:
  # Enable more detailed logs
  - "--log.level=INFO"
  # Cert-manager handles all certificate operations
  # Allow cross-namespace service references
  - "--providers.kubernetescrd.allowCrossNamespace=true"
  # Allow ExternalName services
  - "--providers.kubernetescrd.allowExternalNameServices=true"
  # HTTP to HTTPS redirect
  - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
  - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
  - "--entrypoints.web.http.redirections.entryPoint.permanent=true"

